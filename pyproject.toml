[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bd-phone-toolkit"
version = "0.1.0"
description = "Normalise, validate and classify Bangladeshi mobile numbers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["bangladesh", "phone", "msisdn", "e164"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
bd-phone = "phone_tool.__main__:main"
